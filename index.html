<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <div class="content">
        <div class="clock">
          <div class="clock-line first"></div>
          <div class="clock-line second"></div>
          <div class="clock-line third"></div>
          <div class="clock-line forth"></div>
          <div class="clock-line fifth"></div>
          <div class="clock-line sixth"></div>
          <div class="center">
              <div class="center-neddle">111</div>
        </div>
          
        </div>
    </div>

    <div class="counting">
        <span class="minutes">00</span> <span>:</span> 
        <span class="seconds">00</span> <span>:</span>
        <span class="milliseconds">00</span>
    </div>

    <div class="clock-btn">
        <button onclick="resetCount()"><i class="fa-solid fa-rotate-left"></i></button>
        <button class="clock-btn-center" onclick="startCount()"><i class="fa-solid fa-play"></i></button>
        <button onclick="pauseCount()" class="pause">||</button>
    </div>

 

    </div>
    <script src="app.js"></script>
</body>
</html>
